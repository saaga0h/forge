# docker-compose.test.yaml
# Isolated test stack for integration tests.
# Ports are offset by 10000 from the dev stack to allow both to run simultaneously.
#   MQTT: 11883 (dev: 1883)
#   Nomad: 14646 (dev: 4646)
#   Orchestrator: 18080 (dev: 8080)

services:
  # MQTT Broker (test)
  mqtt-test:
    image: eclipse-mosquitto:2.0@sha256:6852da90a65dfff7aa3a1c8b249e92bb83c17ea8bbcce56bedff8707332a1a29
    container_name: mqtt-test
    ports:
      - "11883:1883"
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-test-data:/mosquitto/data
      - mqtt-test-logs:/mosquitto/log
    networks:
      - gpu-compute-test-net
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "healthcheck", "-m", "ping", "-q", "0"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Nomad (test, custom image with gpu-compute job pre-registered)
  nomad-test:
    build:
      context: nomad-server
      dockerfile: Dockerfile
    container_name: nomad-test
    ports:
      - "14646:4646"
    cap_add:
      - SYS_ADMIN
    networks:
      - gpu-compute-test-net
    healthcheck:
      test: ["CMD", "nomad", "job", "status", "gpu-compute"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

  # Orchestrator (test)
  orchestrator-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchestrator-test
    ports:
      - "18080:8080"
    environment:
      - MQTT_BROKER=tcp://mqtt-test:1883
      - NOMAD_ADDR=http://nomad-test:4646
      - NOMAD_JOB_NAME=gpu-compute
      - PORT=8080
      - OLLAMA_URL=http://localhost:11434
    depends_on:
      mqtt-test:
        condition: service_healthy
      nomad-test:
        condition: service_healthy
    networks:
      - gpu-compute-test-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  mqtt-test-data:
  mqtt-test-logs:

networks:
  gpu-compute-test-net:
    driver: bridge
