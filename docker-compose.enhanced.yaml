# docker-compose.enhanced.yaml
# Full local dev stack with custom Nomad image that auto-registers the gpu-compute job.
# Differs from docker-compose.yaml in that the Nomad server uses a custom image
# (nomad-server/Dockerfile) which runs entrypoint.sh to register the parameterized
# batch job on startup — needed for actual job dispatch testing.
# Usage: docker-compose -f docker-compose.enhanced.yaml up

services:
  # MQTT Broker
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    restart: unless-stopped
    networks:
      - gpu-compute-net
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "test"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nomad Server — custom image with gpu-compute job pre-registered
  nomad-server:
    build:
      context: nomad-server
      dockerfile: Dockerfile
    container_name: nomad-server
    privileged: true
    ports:
      - "4646:4646"
      - "4647:4647"
      - "4648:4648"
    volumes:
      - nomad-data:/opt/nomad/data
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    restart: unless-stopped
    networks:
      - gpu-compute-net
    healthcheck:
      test: ["CMD", "nomad", "job", "status", "gpu-compute"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Consul (service discovery)
  consul:
    image: hashicorp/consul:1.19
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -dev -client=0.0.0.0 -ui
    volumes:
      - consul-data:/consul/data
    restart: unless-stopped
    networks:
      - gpu-compute-net
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Go Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpu-orchestrator
    ports:
      - "8080:8080"
    environment:
      - MQTT_BROKER=tcp://mqtt:1883
      - NOMAD_ADDR=http://nomad-server:4646
      - NOMAD_JOB_NAME=gpu-compute
      - PORT=8080
    depends_on:
      mqtt:
        condition: service_healthy
      nomad-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gpu-compute-net
    volumes:
      - ./configs:/app/configs:ro

volumes:
  mqtt-data:
  mqtt-logs:
  nomad-data:
  consul-data:

networks:
  gpu-compute-net:
    driver: bridge
