# LLM Transcoding Configuration
# For converting semantic diffusion chains to human-readable patterns

llm:
  # Provider: "ollama" for local LLM, "openai" or "anthropic" for cloud (future)
  provider: "ollama"

  # Base URL for Ollama API
  base_url: "http://localhost:11434"

  # Model to use (recommended: llama3.1:8b, qwen:7b, or mistral:7b)
  model: "qwen2.5:7b"

  # Performance tuning
  max_concurrent: 1  # Sequential execution for GPU sharing
  timeout: 30s       # Timeout for LLM requests
  retry_attempts: 3  # Number of retries on failure

  # Caching configuration
  cache_enabled: true
  cache_ttl: 720h  # 30 days - patterns are stable

  # Prompt tuning
  temperature: 0.3    # Low for consistent, deterministic output
  max_tokens: 1000    # Maximum response length
  format: "json"      # Request JSON format responses

# Database configuration for pattern storage
database:
  host: "localhost"
  port: 5432
  name: "home_automation"
  user: "postgres"
  password: "postgres"  # Change in production!
  ssl_mode: "disable"   # Enable in production
  max_connections: 10
  idle_connections: 2

# Aggregation settings
aggregation:
  # Maximum sample anchors to include in LLM prompt
  max_sample_anchors: 10

  # Maximum transitions to include
  max_transitions: 10

  # Whether to use parallel aggregation for multiple chains
  parallel_enabled: true
  max_parallel: 4

# Logging
logging:
  level: "info"  # debug, info, warn, error
  format: "json" # json or text
  output: "stdout"
