<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU Compute Orchestrator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 24px;
      line-height: 1.5;
    }
    h1 { font-size: 1.4em; color: #aaa; font-weight: 400; margin-bottom: 24px; }
    h1 span { color: #7eb8f7; font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #242424;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
    }
    .card h2 { font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 14px; }
    label { display: block; font-size: 0.82em; color: #999; margin-bottom: 5px; margin-top: 12px; }
    label:first-of-type { margin-top: 0; }
    input[type=text], textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: 'SFMono-Regular', 'Consolas', monospace;
      font-size: 0.85em;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type=text]:focus, textarea:focus { border-color: #7eb8f7; }
    textarea { resize: vertical; min-height: 100px; }
    .error-msg { color: #f07070; font-size: 0.78em; margin-top: 5px; display: none; }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 9px;
      background: #2d5a9e;
      color: #e8e8e8;
      border: none;
      border-radius: 5px;
      font-size: 0.88em;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #3a6dbf; }
    button:disabled { background: #333; color: #666; cursor: default; }
    .submit-msg { margin-top: 8px; font-size: 0.8em; color: #888; text-align: center; }
    /* Job list */
    .job-list { overflow-y: auto; max-height: 520px; }
    .job-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.82em;
      border: 1px solid transparent;
      margin-bottom: 4px;
      transition: background 0.1s;
    }
    .job-row:hover { background: #2e2e2e; }
    .job-row.selected { background: #1d2d40; border-color: #2d5a9e; }
    .job-id { font-family: monospace; color: #aaa; font-size: 0.9em; }
    .job-op { color: #c8a0f0; }
    .status { font-size: 0.75em; font-weight: 600; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
    .status-pending    { background: #2a2a0a; color: #c8c060; }
    .status-dispatched { background: #0a1a2a; color: #60a8c8; }
    .status-starting   { background: #0a1a2a; color: #60a8c8; }
    .status-computing  { background: #0a1a2a; color: #60c8c8; }
    .status-completed  { background: #0a2a0a; color: #60c860; }
    .status-failed     { background: #2a0a0a; color: #c86060; }
    .status-timeout    { background: #2a1a0a; color: #c89060; }
    .status-cancelled  { background: #1a1a1a; color: #888; }
    .empty-msg { color: #555; font-size: 0.82em; text-align: center; padding: 30px 0; }
    .refresh-note { font-size: 0.72em; color: #555; text-align: right; margin-top: 8px; }
    /* Detail panel */
    .detail-card { grid-column: 1 / -1; }
    .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .detail-close { background: none; border: 1px solid #444; border-radius: 4px; color: #888; font-size: 0.78em; padding: 3px 9px; cursor: pointer; margin-top: 0; width: auto; }
    .detail-close:hover { color: #ccc; background: #2e2e2e; }
    pre {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 12px;
      font-size: 0.8em;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #c8daf0;
    }
  </style>
</head>
<body>
  <h1><span>GPU Compute Orchestrator</span> — Dev Console</h1>

  <div class="grid">
    <!-- Submit form -->
    <div class="card">
      <h2>Submit Job</h2>
      <label>Operation</label>
      <input type="text" id="operation" placeholder="e.g. my_operation" value="">
      <label>Payload (JSON)</label>
      <textarea id="payload" placeholder='{"key": "value"}'></textarea>
      <div class="error-msg" id="payload-error">Invalid JSON</div>
      <button id="submit-btn" onclick="submitJob()">Submit</button>
      <div class="submit-msg" id="submit-msg"></div>
    </div>

    <!-- Job list -->
    <div class="card">
      <h2>Jobs</h2>
      <div class="job-list" id="job-list">
        <div class="empty-msg">No jobs yet</div>
      </div>
      <div class="refresh-note">Auto-refresh every 2s</div>
    </div>

    <!-- Detail panel (hidden until a job is selected) -->
    <div class="card detail-card" id="detail-card" style="display:none">
      <div class="detail-header">
        <h2 id="detail-title">Job Detail</h2>
        <button class="detail-close" onclick="closeDetail()">✕ Close</button>
      </div>
      <pre id="detail-pre"></pre>
    </div>
  </div>

  <script>
    let selectedJobID = null;

    function statusClass(s) {
      return 'status status-' + (s || 'pending');
    }

    async function loadJobs() {
      try {
        const r = await fetch('/jobs');
        if (!r.ok) return;
        const data = await r.json();
        const jobs = data.jobs || [];
        const el = document.getElementById('job-list');

        if (jobs.length === 0) {
          el.innerHTML = '<div class="empty-msg">No jobs yet</div>';
          return;
        }

        // Sort newest first
        jobs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        el.innerHTML = jobs.map(j => {
          const idShort = (j.job_id || '').substring(0, 8);
          const selected = j.job_id === selectedJobID ? ' selected' : '';
          return `<div class="job-row${selected}" onclick="selectJob('${j.job_id}')">
            <div>
              <div class="job-op">${j.operation || '—'}</div>
              <div class="job-id">${idShort}…</div>
            </div>
            <div></div>
            <span class="${statusClass(j.status)}">${j.status || 'unknown'}</span>
          </div>`;
        }).join('');

        // Refresh selected job detail if visible
        if (selectedJobID) {
          const found = jobs.find(j => j.job_id === selectedJobID);
          if (found) showDetail(found);
        }
      } catch (e) {
        // silently ignore network errors during polling
      }
    }

    async function selectJob(jobID) {
      selectedJobID = jobID;
      try {
        const r = await fetch('/jobs/' + jobID);
        if (!r.ok) return;
        const job = await r.json();
        showDetail(job);
        loadJobs(); // refresh list to update selection highlight
      } catch (e) {}
    }

    function showDetail(job) {
      const card = document.getElementById('detail-card');
      const pre = document.getElementById('detail-pre');
      const title = document.getElementById('detail-title');
      card.style.display = '';
      title.textContent = 'Job ' + (job.job_id || '').substring(0, 8) + '… — ' + (job.status || '');
      pre.textContent = JSON.stringify(job, null, 2);
    }

    function closeDetail() {
      selectedJobID = null;
      document.getElementById('detail-card').style.display = 'none';
      loadJobs();
    }

    async function submitJob() {
      const op = document.getElementById('operation').value.trim();
      const payloadStr = document.getElementById('payload').value.trim();
      const errEl = document.getElementById('payload-error');
      const msgEl = document.getElementById('submit-msg');
      const btn = document.getElementById('submit-btn');

      errEl.style.display = 'none';
      msgEl.textContent = '';

      let payload = {};
      if (payloadStr) {
        try {
          payload = JSON.parse(payloadStr);
        } catch (e) {
          errEl.style.display = 'block';
          return;
        }
      }

      btn.disabled = true;
      msgEl.textContent = 'Submitting…';

      try {
        const r = await fetch('/compute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operation: op, payload }),
        });
        const data = await r.json();
        if (r.ok) {
          msgEl.textContent = 'Submitted: ' + (data.job_id || '').substring(0, 12) + '…';
          selectedJobID = data.job_id;
        } else {
          msgEl.textContent = 'Error: ' + (data.error || r.status);
        }
        loadJobs();
      } catch (e) {
        msgEl.textContent = 'Request failed: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    // Initial load + poll
    loadJobs();
    setInterval(loadJobs, 2000);
  </script>
</body>
</html>
