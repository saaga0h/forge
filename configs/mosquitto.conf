# configs/mosquitto.conf
# Mosquitto MQTT Broker Configuration

# Basic settings
listener 1883
protocol mqtt

# WebSockets (optional, for web clients)
listener 9001
protocol websockets

# Authentication (disabled for development)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# Message size limits
max_packet_size 52428800  # 50MB max message size

# Connection settings
max_connections -1
max_keepalive 65535

# Queue settings  
max_queued_messages 10000
max_inflight_messages 1000

# Retained messages (max_retained_messages removed in Mosquitto 2.0)
retained_persistence true
